services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yerin-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - yerin-vendor:/var/www/html/vendor
      - yerin-node:/var/www/html/node_modules
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      RUN_SETUP: "1"
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  pgsql:
    image: postgres:16-alpine
    container_name: yerin-pgsql
    environment:
      POSTGRES_DB: yerin
      POSTGRES_USER: yerin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - yerin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yerin -d yerin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yerin-redis
    ports:
      - "6379:6379"

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yerin-reverb
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - yerin-vendor:/var/www/html/vendor
      - yerin-node:/var/www/html/node_modules
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      RUN_SETUP: "0"
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

volumes:
  yerin-pgdata:
  yerin-vendor:
  yerin-node:
